<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8">
    <title>ЛР 03 — автентифікація</title>
</head>

<body>
    <h1>ЛР 03 — автентифікація</h1>

    <section>
        <h2>Реєстрація</h2>

        <form id="register">
            <label>
                Ім’я користувача
                <input name="userName" autocomplete="username" required>
            </label>

            <label>
                Email
                <input name="email" type="email" required>
            </label>

            <label>
                Відображуване ім’я
                <input name="displayName" required>
            </label>

            <label>
                Пароль
                <input
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    required>
            </label>

            <button type="submit">Зареєструватися</button>
        </form>

        <pre id="registerResult"></pre>
    </section>

    <hr>

    <section>
        <h2>Вхід</h2>

        <form id="login">
            <label>
                Ім’я
                <input name="userName" autocomplete="username" required>
            </label>

            <label>
                Пароль
                <input
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required>
            </label>

            <button type="submit">Увійти</button>
        </form>

        <pre id="loginResult"></pre>
    </section>

    <hr>

    <section>
        <h2>Поточний профіль</h2>

        <button id="me" type="button">Оновити профіль</button>

        <pre id="profileResult"></pre>
    </section>

    <hr>

    <section>
        <h2>Створення інциденту</h2>

        <form id="incident">
            <label>
                Тема
                <input name="title" required>
            </label>

            <label>
                Опис
                <textarea name="description" required></textarea>
            </label>

            <label>
                Severity
                <select name="severity" required>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                    <option value="Critical">Critical</option>
                </select>
            </label>

            <label>
                Час настання
                <input
                    name="occurredAtUtc"
                    type="datetime-local"
                    required>
            </label>

            <button type="submit">Створити інцидент</button>
        </form>

        <pre id="incidentResult"></pre>
    </section>

    <hr>

    <section>
        <button id="logout" type="button">Вийти</button>

        <pre id="logoutResult"></pre>
    </section>

    <script src="auth-lab.js" defer></script>
</body>

</html>
